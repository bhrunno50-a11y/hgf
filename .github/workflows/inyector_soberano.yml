name: 📡 Mutiny TV - Inyector Multirepositorio v2.0

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub con 3 casilleros
    inputs:
      url_pirata:
        description: 'Chorizo de link a clonar (m3u8, mp4, mkv)'
        required: true
        default: 'PONER_URL_AQUÍ'
      nombre_pelicula:
        description: 'Nombre del archivo final estrictamente terminado en .mp4'
        required: true
        default: 'estreno_mutiny.mp4'
      nombre_repositorio:
        description: 'Nombre del repositorio exclusivo para esta serie (Ej: alien-earth)'
        required: true
        default: 'mi-serie-bunker'

jobs:
  inyector_satelital:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      - name: ⚙️ Instalando herramientas de disección multimedia por hardware
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: 🚀 Descarga Síncrona, Auto-Creación de Repo y Envío al Cofre
        run: |
          # 🪓 [REACTOR CENTRAL v2.0 - DIEGO DYNAMIC REPO CORE]
          export TERM=xterm
          
          # Capturamos tus 3 casilleros del celular horizontal
          URL_FUERZA="${{ github.event.inputs.url_pirata }}"
          VIDEO_FINAL="${{ github.event.inputs.nombre_pelicula }}"
          REPO_TARGET="${{ github.event.inputs.nombre_repositorio }}"
          
          # Convertimos el nombre del repo a minúsculas y limpiamos espacios para que GitHub no chille
          REPO_LIMPIO=$(echo "$REPO_TARGET" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

          echo "📥 Descargando fideo digital con embrague síncrono de audio..."
          # Copia de video a 60x espacial + re-muestreo de audio estéreo estándar de televisión.
          # -async 1 clava los imanes de las pistas borrando el delay de sonido de raíz.
          ffmpeg -y -headers "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
            -timeout 10000000 -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$URL_FUERZA" -c:v copy -c:a aac -ac 2 -ar 44100 -async 1 \
            -bsf:a aac_adtstoasc "$VIDEO_FINAL" || true

          # Verificación de chapa de seguridad
          if [ ! -s "$VIDEO_FINAL" ]; then
             echo "❌ El caño de red se congeló o el link caducó en internet. Abortando."
             exit 1
          fi
          
          echo "✅ Película clonada al 100% Bluray síncrono. Peso:"
          du -sh "$VIDEO_FINAL"

          echo "🛠️ Interrogando a la Matrix: ¿Existe el repositorio $REPO_LIMPIO?"
          # Verificamos de forma remota si el repositorio ya vive en tu perfil
          if ! gh repo view "$REPO_LIMPIO" >/dev/null 2>&1; then
            echo "🆕 El portaviones no existe. Creando repositorio público '$REPO_LIMPIO' de fábrica..."
            # Pare el repositorio público en tu cuenta en un parpadeo mudo
            gh repo create "$REPO_LIMPIO" --public --description "Búnker Privado Soberano Mutiny TV" || true
            sleep 3
          else
            echo "🔄 El portaviones '$REPO_LIMPIO' ya existe en tu perfil. Enganchando cañería..."
          fi

          echo "📦 Verificando o creando el cofre 'bunker_mutiny' en el repositorio destino..."
          # Crea la solapa de la Release adentro del repositorio dinámico. Si ya existe, salta el error limpiamente.
          gh release create bunker_mutiny --repo "${{ github.repository_owner }}/$REPO_LIMPIO" --title "📦 Mutiny TV - Base de Datos Soberana" --notes "Series resguardadas en alta definición." || true

          echo "📤 Eyectando el .mp4 intacto hacia el cofre de destino..."
          # Sube el archivo de forma blindada con el flag --clobber strictly al repositorio dinámico elegido
          gh release upload bunker_mutiny "$VIDEO_FINAL" --repo "${{ github.repository_owner }}/$REPO_LIMPIO" --clobber
          
          echo "🔥 ¡OPERACIÓN COMPLETA EXITOSA! Tu chip de Antel gastó strictly CERO megas."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
