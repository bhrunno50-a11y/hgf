name: 🛩️ Mutiny TV - Pasamano de Contenido Satelital v2.0

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub con casilleros
    inputs:
      url_release_vieja:
        description: 'URL directa de la Release vieja en Cuenta B (.mp4)'
        required: true
        default: 'https://github.com'
      nombre_archivo_nuevo:
        description: 'Nombre final camuflado strictly en formato de texto .txt (Ej: colaterales_04.txt)'
        required: true
        default: 'estreno_mutiny.txt'

jobs:
  clonado_bunker:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando gatera local en el disco de Microsoft
        uses: actions/checkout@v4

      - name: ⚙️ Instalando herramientas de disección multimedia
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: 🚀 Succionando de Servidor a Servidor en Frío Absoluto
        run: |
          # 🪓 [REACTOR PASAMANO v2.0 - DIEGO CLOUD BRIDGE MANUAL FIXED]
          export TERM=xterm
          
          # Capturamos tus casilleros del celular horizontal
          URL_B="${{ github.event.inputs.url_release_vieja }}"
          NOMBRE_TXT="${{ github.event.inputs.nombre_archivo_nuevo }}"

          echo "📥 Chupando el video de 1.2GB desde la Cuenta B a velocidad gigabit..."
          # Se traga el archivo en la RAM de la Actions de servidor a servidor en 10 segundos sordos
          curl -L -o "$NOMBRE_TXT" "$URL_B"

          # Verificación de chapa anti-bancarrota de tus datos móviles
          if [ ! -s "$NOMBRE_TXT" ]; then
             echo "❌ El caño de red vino vacío o la URL de la Cuenta B falló. Abortando."
             exit 1
          fi

          echo "✅ Película enjaulada en la RAM local con éxito. Peso:"
          du -sh "$NOMBRE_TXT"

          echo "📦 Fabricando el nuevo cofre 'bunker_mutiny' en tu Cuenta C..."
          # Crea la Release limpia en tu nueva cuenta de forma automática
          gh release create bunker_mutiny --title "📦 Mutiny TV - Base de Datos Privada Soberana" --notes "Películas de 1.2GB resguardadas en formato .txt eternas libres de bloqueo attachment." || true

          echo "📤 Eyectando el archivo camuflado en las Releases de tu Cuenta C..."
          # Sube el .txt de un solo tajo plano a tu cuenta nueva
          gh release upload bunker_mutiny "$NOMBRE_TXT" --clobber
          
          echo "🔥 ¡OPERACIÓN COMPLETA DEBOXES! Tu chip de Antel gastó strictly CERO megas."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
